services:
  ui:
    build: .
    ports:
      - "${UI_PORT:-8765}:8765"
    environment:
      UI_SERVER_HOST: 0.0.0.0
      UI_SERVER_PORT: 8765
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./scenarios:/app/scenarios
      - ./output:/app/output
      - ./catalog:/app/catalog:ro
      - hf_cache:/root/.cache/huggingface
    command: ["python", "ui_server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cli:
    build: .
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./scenarios:/app/scenarios
      - ./output:/app/output
      - ./catalog:/app/catalog:ro
      - hf_cache:/root/.cache/huggingface
    command: ["python", "run_all.py", "--detailed"]
    profiles: ["cli"]

  test:
    build: .
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    profiles: ["test"]

  catalog:
    build: .
    command: ["python", "run_all.py", "--list-hardware"]
    profiles: ["catalog"]

volumes:
  hf_cache:
