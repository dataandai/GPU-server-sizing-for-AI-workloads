# Scenario 6: Mixed batch — short + medium + long jobs
scenario_name: "mixed_batch_17jobs"
hardware_profile: "h200_8gpu"
weight_precision: "int8"
kv_cache_precision: "fp16"
tensor_parallel_degree: 8
runtime_overhead_ratio: 0.10
max_vram_utilization_target: 0.95
safety_headroom_ratio: 0.05

workload_type: "mixed_batch"
workload:
  classes:
    - label: "short"
      prompt_tokens: 256
      max_output_tokens: 128
      count: 10
    - label: "medium"
      prompt_tokens: 2048
      max_output_tokens: 1024
      count: 5
    - label: "long"
      prompt_tokens: 8192
      max_output_tokens: 4096
      count: 2

monte_carlo_enabled: false
